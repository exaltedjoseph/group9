[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-library"
version = "1.0.0"
description = "Resource Database Study System: a local, Git-versioned library of training materials and classwork with Gemini-assisted tagging."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Group 9" }]
dependencies = [
    "PySide6>=6.6",
    "google-genai>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
study-library = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
